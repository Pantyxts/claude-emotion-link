<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>claude-emotion-link — 小喵の魔法表情 ✦</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Background -->
  <div class="bg-stars"></div>
  <div class="bg-glow"></div>

  <!-- Floating effects container -->
  <div class="float-effects" id="float-effects"></div>

  <!-- Loading screen -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">正在加载 Live2D 模型…</div>
    <div class="loading-sub">Hiyori (Cubism 4) · 28 Parameters</div>
  </div>

  <!-- Always-on-top emotion badge -->
  <div class="emotion-badge-top" id="emotion-badge-top">
    <span class="badge-icon" id="badge-icon">😊</span>
    <span class="badge-text" id="badge-text">平常</span>
  </div>

  <!-- Main application -->
  <div class="app">

    <!-- Header -->
    <div class="header">
      <span class="header-icon">✦</span>
      <span>claude-emotion-link</span>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-label" id="status-label">连接中…</span>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="tail-canvas"></canvas>
      <canvas id="live2d-canvas"></canvas>

      <!-- Emotion overlay -->
      <div class="emotion-overlay">
        <span class="emotion-icon" id="emotion-icon">😊</span>
        <span class="emotion-name" id="emotion-name">平常</span>
      </div>
    </div>

      <!-- Toolbar -->
    <div class="toolbar">
      <button class="tool-btn" id="popup-btn" title="在新窗口打开角色（透明背景，适合OBS捕获）">📌 弹出角色</button>
      <button class="tool-btn" id="model-btn" title="切换或导入 Live2D 模型">📁 切换模型</button>
      <button class="demo-btn" id="demo-btn" title="按空格键切换演示模式">▶ 演示模式</button>
      <div class="demo-indicator" id="demo-indicator" style="display:none">
        <span class="demo-dot"></span> 演示中
      </div>
      <span class="kb-hint">快捷键 0-9 切换表情 · 空格 演示</span>

      <!-- Model switcher panel (hidden by default) -->
      <div class="model-panel" id="model-panel" style="display:none">
        <div class="model-panel-title">切换模型</div>
        <div class="model-list" id="model-list">加载中...</div>
        <div class="model-custom">
          <input type="text" id="model-path-input" placeholder="输入模型路径或 URL（如 models/xxx/model3.json）">
          <button class="tool-btn" id="model-load-btn">加载</button>
        </div>
        <div class="model-custom" style="margin-top:4px;">
          <span style="font-size:11px;color:#5a70a0;">或者选择文件夹导入：</span>
          <input type="file" id="model-file-input" accept=".model3.json" style="font-size:11px;color:#8ab4f0;">
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="corner-info">claude-emotion-link v2.2 · Hiyori C4 28 · MIT</div>

  </div>

  <!-- ==========================================
       CDN Dependencies
       Order matters: Cubism Core → PIXI.js → pixi-live2d-display
       ========================================== -->
  <script src="lib/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

  <!-- Application -->
  <script src="js/viewer.js"></script>

</body>
</html>
